name: Security & Audit Scan

on:
  push:
    branches: [main, master, develop]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main, master, develop]
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [spotify-backend, spotify-admin, spotify-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Audit Dependencies
        working-directory: ./${{ matrix.project }}
        run: |
          npm audit --audit-level=high || true

  secret-detection:
    name: Secret & Environment Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Committed .env Files
        run: |
          echo "Scanning git tracked files for committed secrets/env files..."
          COMMITTED_ENVS=$(git ls-files | grep -E "(^|/)\.env(\..+)?$" | grep -v "\.env\.example" || true)
          if [ -n "$COMMITTED_ENVS" ]; then
            echo "::warning ::Found tracked .env files in git index: $COMMITTED_ENVS"
          else
            echo "✅ No sensitive .env files tracked in git"
          fi
